[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spectral-peaks"
version = "0.1.0"
description = "Spectral peak finding algorithms implemented with pure Python + NumPy (no SciPy required)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "nwnuzhao" }]
keywords = ["spectroscopy", "spectrum", "peak-detection", "peak-finding", "baseline", "savitzky-golay", "numpy"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Intended Audience :: Science/Research",
]
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
# The library itself only needs NumPy; SciPy is used by the cross-validation
# tests (they are skipped automatically when SciPy is missing).
test = ["pytest>=7", "scipy>=1.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
